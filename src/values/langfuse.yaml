# Langfuse on one node. Postgres, Redis and ClickHouse are the plain Deployments in ai-gateway.yaml; only the
# SeaweedFS S3 store comes from the chart. Secrets come from Secret ai-secrets (created by Day 0); the S3 password is generated by the chart.
fullnameOverride: langfuse
langfuse:
  salt:
    secretKeyRef: { name: ai-secrets, key: LANGFUSE_SALT }
  encryptionKey:
    secretKeyRef: { name: ai-secrets, key: LANGFUSE_ENCRYPTION_KEY }
  nextauth:
    url: http://localhost:3000
    secret:
      secretKeyRef: { name: ai-secrets, key: LANGFUSE_NEXTAUTH_SECRET }
  # First user, organisation and project (with API keys) created at startup
  additionalEnv:
    - { name: LANGFUSE_INIT_ORG_ID, value: ai-gateway }
    - { name: LANGFUSE_INIT_ORG_NAME, value: AI Gateway }
    - { name: LANGFUSE_INIT_PROJECT_ID, value: ai-gateway }
    - { name: LANGFUSE_INIT_PROJECT_NAME, value: ai-gateway }
    - { name: LANGFUSE_INIT_USER_NAME, value: admin }
    - name: LANGFUSE_INIT_USER_EMAIL
      valueFrom: { secretKeyRef: { name: ai-secrets, key: LANGFUSE_INIT_USER_EMAIL } }
    - name: LANGFUSE_INIT_USER_PASSWORD
      valueFrom: { secretKeyRef: { name: ai-secrets, key: LANGFUSE_INIT_USER_PASSWORD } }
    - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
      valueFrom: { secretKeyRef: { name: ai-secrets, key: LANGFUSE_PUBLIC_KEY } }
    - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
      valueFrom: { secretKeyRef: { name: ai-secrets, key: LANGFUSE_SECRET_KEY } }
  features:
    telemetryEnabled: false
  web:
    image: { pullPolicy: IfNotPresent }
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 1500Mi }
  worker:
    image: { pullPolicy: IfNotPresent }
    resources:
      requests: { cpu: 100m, memory: 384Mi }
      limits: { memory: 1500Mi }

postgresql:
  deploy: false
  host: postgres
  port: 5432
  auth:
    username: ai
    database: langfuse
    existingSecret: ai-secrets
    secretKeys:
      userPasswordKey: POSTGRES_PASSWORD

redis:
  deploy: false
  host: redis
  port: 6379
  auth:
    username: default
    existingSecret: ai-secrets
    existingSecretPasswordKey: REDIS_PASSWORD

clickhouse:
  deploy: false
  crdCheck: false
  host: clickhouse
  auth:
    username: default
    existingSecret: ai-secrets
    existingSecretKey: CLICKHOUSE_PASSWORD
  cluster:
    enabled: false

s3:
  deploy: true
  bucket: langfuse
  auth:
    rootUser: langfuse        # the chart generates and keeps the password in Secret langfuse-s3-auth
  defaultBuckets: langfuse
  allInOne:
    s3:
      createBuckets:
        - name: langfuse
        - name: rag-docs
    data:
      size: 20Gi
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 1Gi }

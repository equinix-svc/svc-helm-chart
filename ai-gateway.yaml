# LiteLLM guardrail modules, mounted next to the proxy config (see the litellm HelmChart below)
apiVersion: v1
kind: ConfigMap
metadata: { name: litellm-guardrails, namespace: ai-gateway }
data:
  llm_guard_guardrail.py: |
    """llm_guard_guardrail.py - LiteLLM guardrail backed by the in-cluster llm-guard service.

    pre_call : prompt-injection check on the last user message (blocks with HTTP 400) and secrets redaction on every
               string message.
    post_call: secrets redaction on the model reply.
    If the llm-guard service is unreachable the request passes unchanged (fail open, logged).
    """
    import os

    import httpx
    from fastapi import HTTPException

    from litellm._logging import verbose_proxy_logger
    from litellm.integrations.custom_guardrail import CustomGuardrail

    URL = os.environ.get("LLM_GUARD_URL", "http://llm-guard:8000")
    TIMEOUT = float(os.environ.get("LLM_GUARD_TIMEOUT", "10"))


    async def _post(path: str, text: str) -> dict:
        async with httpx.AsyncClient(timeout=TIMEOUT) as client:
            r = await client.post(f"{URL}{path}", json={"text": text})
            r.raise_for_status()
            return r.json()


    class LlmGuardGuardrail(CustomGuardrail):
        async def async_pre_call_hook(self, user_api_key_dict, cache, data: dict, call_type):
            messages = data.get("messages") or []
            try:
                last = next((m for m in reversed(messages)
                             if m.get("role") == "user" and isinstance(m.get("content"), str)), None)
                if last:
                    verdict = await _post("/scan/prompt", last["content"])
                    if verdict.get("block"):
                        raise HTTPException(status_code=400, detail=f"llm-guard BLOCKED: {verdict.get('reason')}")
                for m in messages:
                    if isinstance(m.get("content"), str):
                        res = await _post("/scan/secrets", m["content"])
                        if res.get("found"):
                            m["content"] = res["text"]
            except HTTPException:
                raise
            except Exception as exc:
                verbose_proxy_logger.warning("llm-guard unavailable, request passed unchecked: %s", exc)
            return data

        async def async_post_call_success_hook(self, data: dict, user_api_key_dict, response):
            try:
                for choice in getattr(response, "choices", None) or []:
                    msg = getattr(choice, "message", None)
                    if msg is not None and isinstance(msg.content, str):
                        res = await _post("/scan/secrets", msg.content)
                        if res.get("found"):
                            msg.content = res["text"]
            except Exception as exc:
                verbose_proxy_logger.warning("llm-guard unavailable, reply passed unchecked: %s", exc)
            return response
  rag_augment.py: |
    """rag_augment.py - LiteLLM pre-call guardrail: retrieve top-k chunks from the in-cluster rag-service and prepend
    them as a system message. Opt-in per request ("guardrails": ["rag-augment"]). Retrieval failure never blocks the call.
    """
    import os

    import httpx

    from litellm._logging import verbose_proxy_logger
    from litellm.integrations.custom_guardrail import CustomGuardrail

    URL = os.environ.get("RAG_URL", "http://rag-service:8000")
    TOP_K = int(os.environ.get("RAG_TOP_K", "3"))
    MAX_CHARS = int(os.environ.get("RAG_MAX_CONTEXT_CHARS", "6000"))


    class RagAugmentGuardrail(CustomGuardrail):
        async def async_pre_call_hook(self, user_api_key_dict, cache, data: dict, call_type):
            messages = list(data.get("messages") or [])
            query = next((m["content"] for m in reversed(messages)
                          if m.get("role") == "user" and isinstance(m.get("content"), str)), "")
            if not query:
                return data
            try:
                async with httpx.AsyncClient(timeout=10) as client:
                    r = await client.post(f"{URL}/retrieve", json={"query": query, "top_k": TOP_K})
                    r.raise_for_status()
                    chunks = r.json().get("chunks", [])
            except Exception as exc:
                verbose_proxy_logger.warning("RAG retrieval failed, continuing without context: %s", exc)
                return data
            parts, total = [], 0
            for i, c in enumerate(chunks):
                if total + len(c["text"]) > MAX_CHARS:
                    break
                parts.append(f"[Context {i + 1}] ({c['source']}): {c['text']}")
                total += len(c["text"])
            if parts:
                data["messages"] = [{"role": "system", "content": "Retrieved context:\n\n" + "\n\n".join(parts)}, *messages]
            return data
---
# LiteLLM is the only service exposed outside the cluster (Traefik, any host name).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: litellm
  namespace: ai-gateway
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: ai-litellm, port: { number: 4000 } } }
---
# ---------------------------------------------------------------------------------------------------------
# Helm charts (installed by the k3s Helm controller; versions pinned)
# ---------------------------------------------------------------------------------------------------------
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata: { name: qdrant, namespace: kube-system }
spec:
  repo: https://qdrant.github.io/qdrant-helm
  chart: qdrant
  version: 1.20.0
  targetNamespace: ai-gateway
  valuesContent: |-
    fullnameOverride: qdrant
    replicaCount: 1
    persistence:
      size: 5Gi
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 1Gi }
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata: { name: langfuse, namespace: kube-system }
spec:
  repo: https://langfuse.github.io/langfuse-k8s
  chart: langfuse
  version: 2.2.3
  targetNamespace: ai-gateway
  timeout: 20m
  valuesContent: |-
    # Langfuse on one node. Postgres, Redis and ClickHouse are the plain Deployments in ai-gateway.yaml; only the
    # SeaweedFS S3 store comes from the chart. Secrets come from Secret ai-secrets (created by Day 0); the S3 password is generated by the chart.
    fullnameOverride: langfuse
    langfuse:
      salt:
        secretKeyRef: { name: ai-secrets, key: LANGFUSE_SALT }
      encryptionKey:
        secretKeyRef: { name: ai-secrets, key: LANGFUSE_ENCRYPTION_KEY }
      nextauth:
        url: http://localhost:3000
        secret:
          secretKeyRef: { name: ai-secrets, key: LANGFUSE_NEXTAUTH_SECRET }
      # First user, organisation and project (with API keys) created at startup
      additionalEnv:
        # Service "redis" makes Kubernetes inject REDIS_PORT=tcp://<ip>:6379 into every Pod; Langfuse parses REDIS_PORT as a number
        # and crashes (ZodError NaN). An explicit value overrides the injected one.
        - { name: REDIS_PORT, value: "6379" }
        - { name: LANGFUSE_INIT_ORG_ID, value: ai-gateway }
        - { name: LANGFUSE_INIT_ORG_NAME, value: AI Gateway }
        - { name: LANGFUSE_INIT_PROJECT_ID, value: ai-gateway }
        - { name: LANGFUSE_INIT_PROJECT_NAME, value: ai-gateway }
        - { name: LANGFUSE_INIT_USER_NAME, value: admin }
        - name: LANGFUSE_INIT_USER_EMAIL
          valueFrom: { secretKeyRef: { name: ai-secrets, key: LANGFUSE_INIT_USER_EMAIL } }
        - name: LANGFUSE_INIT_USER_PASSWORD
          valueFrom: { secretKeyRef: { name: ai-secrets, key: LANGFUSE_INIT_USER_PASSWORD } }
        - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
          valueFrom: { secretKeyRef: { name: ai-secrets, key: LANGFUSE_PUBLIC_KEY } }
        - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
          valueFrom: { secretKeyRef: { name: ai-secrets, key: LANGFUSE_SECRET_KEY } }
      features:
        telemetryEnabled: false
      web:
        image: { pullPolicy: IfNotPresent }
        resources:
          requests: { cpu: 100m, memory: 512Mi }
          limits: { memory: 1500Mi }
      worker:
        image: { pullPolicy: IfNotPresent }
        resources:
          requests: { cpu: 100m, memory: 384Mi }
          limits: { memory: 1500Mi }

    postgresql:
      deploy: false
      host: postgres
      port: 5432
      auth:
        username: ai
        database: langfuse
        existingSecret: ai-secrets
        secretKeys:
          userPasswordKey: POSTGRES_PASSWORD

    redis:
      deploy: false
      host: redis
      port: 6379
      auth:
        username: default
        existingSecret: ai-secrets
        existingSecretPasswordKey: REDIS_PASSWORD

    clickhouse:
      deploy: false
      crdCheck: false
      host: clickhouse
      auth:
        username: default
        existingSecret: ai-secrets
        existingSecretKey: CLICKHOUSE_PASSWORD
      cluster:
        enabled: false

    s3:
      deploy: true
      bucket: langfuse
      auth:
        rootUser: langfuse        # the chart generates and keeps the password in Secret langfuse-s3-auth
      defaultBuckets: langfuse
      allInOne:
        s3:
          createBuckets:
            - name: langfuse
            - name: rag-docs
        data:
          size: 20Gi
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { memory: 1Gi }
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata: { name: ai, namespace: kube-system }
spec:
  chart: oci://ghcr.io/berriai/litellm-helm
  version: 1.108.0
  targetNamespace: ai-gateway
  timeout: 20m
  valuesContent: |-
    # LiteLLM proxy. Release name "ai" -> Service ai-litellm:4000. Database, keys and API keys come from existing
    # Secrets (ai-secrets, litellm-env), created by Day 0.
    image:
      pullPolicy: IfNotPresent
    db:
      useExisting: true
      deployStandalone: false
      endpoint: postgres
      database: litellm
      secret:
        name: ai-secrets
        usernameKey: POSTGRES_USER
        passwordKey: POSTGRES_PASSWORD
    masterkeySecretName: litellm-env
    masterkeySecretKey: LITELLM_MASTER_KEY
    environmentSecrets:
      - litellm-env
    envVars:
      STORE_MODEL_IN_DB: "True"
      PRESIDIO_ANALYZER_API_BASE: http://presidio-analyzer:3000
      PRESIDIO_ANONYMIZER_API_BASE: http://presidio-anonymizer:3000
      LLM_GUARD_URL: http://llm-guard:8000
      RAG_URL: http://rag-service:8000
      LANGFUSE_HOST: http://langfuse-web:3000
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 2Gi }
    volumes:
      - name: guardrails
        configMap: { name: litellm-guardrails }
    volumeMounts:
      - { name: guardrails, mountPath: /etc/litellm/llm_guard_guardrail.py, subPath: llm_guard_guardrail.py }
      - { name: guardrails, mountPath: /etc/litellm/rag_augment.py, subPath: rag_augment.py }
    proxy_config:
      model_list:
        - model_name: groq-qwen
          litellm_params:
            model: groq/qwen/qwen3.8-27b
            api_key: os.environ/GROQ_API_KEY
        - model_name: gemini-flash
          litellm_params:
            model: gemini/gemini-3.5-flash-lite
            api_key: os.environ/GEMINI_API_KEY
        # Pool: one virtual name, usage-based routing across both hosted backends.
        - model_name: llm-pool
          litellm_params:
            model: groq/qwen/qwen3.8-27b
            api_key: os.environ/GROQ_API_KEY
        - model_name: llm-pool
          litellm_params:
            model: gemini/gemini-3.5-flash-lite
            api_key: os.environ/GEMINI_API_KEY

      guardrails:
        # Order matters: RAG sees the original prompt, LLM Guard blocks injections and redacts secrets, then Presidio masks PII.
        - guardrail_name: rag-augment
          litellm_params:
            guardrail: rag_augment.RagAugmentGuardrail
            mode: pre_call
            default_on: false          # opt-in per request: "guardrails": ["rag-augment"]
        - guardrail_name: llm-guard
          litellm_params:
            guardrail: llm_guard_guardrail.LlmGuardGuardrail
            mode: [pre_call, post_call]
            default_on: true
        - guardrail_name: presidio-pre-call
          litellm_params:
            guardrail: presidio
            mode: pre_call
            default_on: true
            pii_entities_config: &pii
              CREDIT_CARD: MASK
              EMAIL_ADDRESS: MASK
              PHONE_NUMBER: MASK
              US_SSN: MASK
              PERSON: MASK
              IBAN_CODE: MASK
        - guardrail_name: presidio-post-call
          litellm_params:
            guardrail: presidio
            mode: post_call
            default_on: true
            pii_entities_config: *pii

      litellm_settings:
        set_verbose: false
        # Exact-match response cache, opt-in per request ("cache": {"use-cache": true}).
        cache: true
        cache_params:
          type: redis
          host: redis
          port: 6379
          password: os.environ/REDIS_PASSWORD
          ttl: 600
          mode: default_off
          supported_call_types: ["acompletion", "completion"]
        success_callback: ["langfuse"]
        failure_callback: ["langfuse"]

      general_settings:
        master_key: os.environ/LITELLM_MASTER_KEY

      router_settings:
        redis_host: redis
        redis_port: 6379
        redis_password: os.environ/REDIS_PASSWORD
        routing_strategy: usage-based-routing
        enable_pre_call_check: false

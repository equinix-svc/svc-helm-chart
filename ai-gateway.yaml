# AI gateway stack for a single k3s node. Source template: scripts/build.py turns it into ai-gateway.yaml
# (every "@@FILE path@@" line is replaced by that file, indented as the marker is).
#
# Drop the generated ai-gateway.yaml into /var/lib/rancher/k3s/server/manifests/ (or kubectl apply it). k3s's
# built-in Helm controller installs the three HelmChart resources; everything else is plain Kubernetes.
# Secrets are NOT in this file: Day 0 creates Secrets ai-secrets and litellm-env first (see README.md).
#
#   LiteLLM  -> Presidio (PII), LLM Guard (injection, secrets), rag-service -> Qdrant + S3, Langfuse (traces)
#   Postgres (litellm, langfuse), Redis, ClickHouse (Langfuse), SeaweedFS S3 (from the Langfuse chart)
apiVersion: v1
kind: Namespace
metadata:
  name: ai-gateway
---
# ---------------------------------------------------------------------------------------------------------
# Shared data services (official images)
# ---------------------------------------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: ai-gateway
data:
  10-langfuse-db.sql: |
    CREATE DATABASE langfuse;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: postgres-data, namespace: ai-gateway }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 10Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: ai-gateway }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - { name: POSTGRES_DB, value: litellm }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: ai-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: ai-secrets, key: POSTGRES_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d litellm'] }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: postgres-data } }
        - { name: init, configMap: { name: postgres-init } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: ai-gateway }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
---
# One Redis for LiteLLM (router state, opt-in cache) and Langfuse (queues); Langfuse needs noeviction.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: redis-data, namespace: ai-gateway }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: ai-gateway }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: [sh, -c, 'exec redis-server --requirepass "$REDIS_PASSWORD" --maxmemory-policy noeviction --appendonly yes']
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: ai-secrets, key: REDIS_PASSWORD } }
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: [sh, -c, 'redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG'] }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: redis-data } }
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: ai-gateway }
spec:
  selector: { app: redis }
  ports: [{ port: 6379 }]
---
# Single ClickHouse for Langfuse (the chart's own ClickHouse needs an operator and a 3-node Keeper).
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: clickhouse-data, namespace: ai-gateway }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 20Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: clickhouse, namespace: ai-gateway }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: clickhouse } }
  template:
    metadata: { labels: { app: clickhouse } }
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:26.8.36.3
          env:
            - { name: CLICKHOUSE_DB, value: default }
            - { name: CLICKHOUSE_USER, value: default }
            - { name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, value: "1" }
            - name: CLICKHOUSE_PASSWORD
              valueFrom: { secretKeyRef: { name: ai-secrets, key: CLICKHOUSE_PASSWORD } }
          ports: [{ containerPort: 8123 }, { containerPort: 9000 }]
          readinessProbe:
            httpGet: { path: /ping, port: 8123 }
            periodSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 1Gi }
            limits: { memory: 3Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/clickhouse }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: clickhouse-data } }
---
apiVersion: v1
kind: Service
metadata: { name: clickhouse, namespace: ai-gateway }
spec:
  selector: { app: clickhouse }
  ports:
    - { name: http, port: 8123 }
    - { name: native, port: 9000 }
---
# ---------------------------------------------------------------------------------------------------------
# Guardrails and RAG (stock images; code from ConfigMaps; Python packages installed once into a volume)
# ---------------------------------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata: { name: presidio-analyzer, namespace: ai-gateway }
spec:
  replicas: 1
  selector: { matchLabels: { app: presidio-analyzer } }
  template:
    metadata: { labels: { app: presidio-analyzer } }
    spec:
      containers:
        - name: presidio-analyzer
          image: mcr.microsoft.com/presidio-analyzer:latest
          ports: [{ containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 600Mi }
            limits: { memory: 1500Mi }
---
apiVersion: v1
kind: Service
metadata: { name: presidio-analyzer, namespace: ai-gateway }
spec:
  selector: { app: presidio-analyzer }
  ports: [{ port: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: presidio-anonymizer, namespace: ai-gateway }
spec:
  replicas: 1
  selector: { matchLabels: { app: presidio-anonymizer } }
  template:
    metadata: { labels: { app: presidio-anonymizer } }
    spec:
      containers:
        - name: presidio-anonymizer
          image: mcr.microsoft.com/presidio-anonymizer:latest
          ports: [{ containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: presidio-anonymizer, namespace: ai-gateway }
spec:
  selector: { app: presidio-anonymizer }
  ports: [{ port: 3000 }]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: llm-guard-app, namespace: ai-gateway }
data:
  app.py: |
    """LLM Guard service for the LiteLLM guardrail (litellm/llm_guard_guardrail.py).

    POST /scan/prompt   {"text": ...} -> {"block": bool, "risk": float, "reason": str}
    POST /scan/secrets  {"text": ...} -> {"found": bool, "text": <redacted text>}

    Scanner logic is carried over unchanged from the earlier lab's llm-guard adapter: DeBERTa v3 must flag the text AND
    explicit injection vocabulary must be present, because DeBERTa alone scores many benign instruction-shaped phrases
    near 1.0. Only the Portkey webhook contract and the metrics hook were dropped.
    """
    import os
    import re

    import torch
    from fastapi import FastAPI
    from llm_guard.input_scanners import PromptInjection, Secrets
    from llm_guard.input_scanners.prompt_injection import MatchType

    app = FastAPI()

    # One thread per vCPU stalls at the thread barrier when another process holds a core; leave headroom.
    torch.set_num_threads(int(os.environ.get("TORCH_NUM_THREADS", "4")))

    # SENTENCE: a small payload hidden in a long legitimate document is diluted when the whole text is scored at once.
    injection_scanner = PromptInjection(match_type=MatchType.SENTENCE)
    secrets_scanner = Secrets()

    INJECTION_SIGNALS = [
        'ignore previous instructions', 'ignore all previous', 'ignore your instructions',
        'disregard your', 'forget your instructions', 'forget your previous',
        'override your instructions', 'system prompt', 'you are now',
        'act as a ', 'act as an ', 'pretend you have', 'pretend to be',
        'jailbreak', 'no restrictions', 'no rules', 'uncensored', 'unrestricted ai',
        'system override', 'developer mode', 'admin override',
        'bypass your', 'break character', 'reveal your system', 'new instructions:',
    ]
    INJECTION_PATTERNS = [
        re.compile(p, re.I | re.S) for p in (
            r"\bignore\b[^.\n]{0,40}\b(task|tasks|instruction|instructions|rules?|prompt|guidelines?|previous|above|everything)\b",
            r"\b(note|message|instruction|comment)s?\s+(for|to)\s+(the\s+)?(ai|llm|assistant|model|chatbot)\b",
            r"\b(ai|llm)\s+assistant\s*[:,]",
            r"\b(print|output|reveal|show|send|email|leak|dump|exfiltrate|list)\b[^.\n]{0,60}\b(env(ironment)?\s+variables?|api\s+keys?|secrets?|credentials?|passwords?|\.env|tokens?)\b",
            r"\binstead,?\s+(output|print|reveal|show|say|send)\b",
        )
    ]


    def has_signals(text: str) -> bool:
        lower = text.lower()
        return any(s in lower for s in INJECTION_SIGNALS) or any(p.search(text) for p in INJECTION_PATTERNS)


    @app.get("/healthz")
    def healthz():
        return {"ok": True}


    @app.post("/scan/prompt")
    def scan_prompt(payload: dict):
        text = payload.get("text") or ""
        if not text:
            return {"block": False, "risk": 0.0, "reason": ""}
        _, is_valid, risk = injection_scanner.scan(text)
        block = (not is_valid) and has_signals(text)
        return {"block": block, "risk": risk, "reason": f"prompt injection (risk {round(risk * 100)}%)" if block else ""}


    @app.post("/scan/secrets")
    def scan_secrets(payload: dict):
        text = payload.get("text") or ""
        if not text:
            return {"found": False, "text": text}
        sanitized, is_valid, _ = secrets_scanner.scan(text)
        return {"found": not is_valid, "text": sanitized}
  requirements.txt: |
    fastapi==0.115.6
    uvicorn==0.32.1
    llm-guard==0.3.16
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: llm-guard-data, namespace: ai-gateway }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 8Gi } }
---
# First start installs CPU-only PyTorch + llm-guard into /data/venv and downloads the DeBERTa v3 weights into
# /data/hf (about 10 minutes, a few GB). Later restarts reuse the volume.
apiVersion: apps/v1
kind: Deployment
metadata: { name: llm-guard, namespace: ai-gateway }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: llm-guard } }
  template:
    metadata: { labels: { app: llm-guard } }
    spec:
      containers:
        - name: llm-guard
          image: python:3.12-slim
          workingDir: /app
          command:
            - sh
            - -c
            - |
              set -e
              if [ ! -x /data/venv/bin/uvicorn ]; then
                python -m venv /data/venv
                /data/venv/bin/pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
                /data/venv/bin/pip install --no-cache-dir -r /app/requirements.txt
              fi
              exec /data/venv/bin/uvicorn app:app --host 0.0.0.0 --port 8000
          env:
            - { name: HF_HOME, value: /data/hf }
            - { name: TORCH_NUM_THREADS, value: "4" }
          ports: [{ containerPort: 8000 }]
          startupProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 10
            failureThreshold: 180      # up to 30 minutes for the first install and model download
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 1Gi }
            limits: { memory: 3Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: app, mountPath: /app }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: llm-guard-data } }
        - { name: app, configMap: { name: llm-guard-app } }
---
apiVersion: v1
kind: Service
metadata: { name: llm-guard, namespace: ai-gateway }
spec:
  selector: { app: llm-guard }
  ports: [{ port: 8000 }]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: rag-service-app, namespace: ai-gateway }
data:
  app.py: |
    """RAG service: embeds in-process (fastembed ONNX), stores in Qdrant, reads source documents from the S3 store (SeaweedFS).

    POST /retrieve {"query": str, "top_k": int}          -> chunks for the LiteLLM rag_augment guardrail
    POST /ingest   {"bucket": "rag-docs", "prefix": ""}  -> chunk + embed every .txt / .md object into Qdrant

    Derived from the earlier lab's rag-adapter (same chunking and Qdrant search), with Ollama and Gemini embeddings
    replaced by a local model and the Portkey webhook contract dropped.
    """
    import os
    import uuid

    import boto3
    from botocore.config import Config
    import httpx
    from fastapi import FastAPI
    from fastembed import TextEmbedding

    QDRANT_URL = os.environ.get("QDRANT_URL", "http://qdrant:6333")
    COLLECTION = os.environ.get("QDRANT_COLLECTION", "knowledge-base")
    MODEL = os.environ.get("EMBED_MODEL", "BAAI/bge-small-en-v1.5")
    DIM = 384
    CHUNK_CHARS = 1800

    app = FastAPI()
    embedder = TextEmbedding(MODEL)


    def embed(texts: list[str]) -> list[list[float]]:
        return [v.tolist() for v in embedder.embed(texts)]


    def s3():
        return boto3.client(
            "s3", endpoint_url=os.environ["S3_ENDPOINT"],
            aws_access_key_id=os.environ["S3_ACCESS_KEY"], aws_secret_access_key=os.environ["S3_SECRET_KEY"],
            region_name="us-east-1", config=Config(s3={"addressing_style": "path"}),
        )


    def ensure_collection(client: httpx.Client) -> None:
        if client.get(f"{QDRANT_URL}/collections/{COLLECTION}").status_code == 200:
            return
        client.put(f"{QDRANT_URL}/collections/{COLLECTION}",
                   json={"vectors": {"size": DIM, "distance": "Cosine"}}).raise_for_status()


    def chunks_of(text: str) -> list[str]:
        out, cur = [], ""
        for para in text.split("\n\n"):
            if cur and len(cur) + len(para) > CHUNK_CHARS:
                out.append(cur.strip())
                cur = ""
            cur += para + "\n\n"
        if cur.strip():
            out.append(cur.strip())
        return out


    @app.get("/healthz")
    def healthz():
        return {"ok": True}


    @app.post("/retrieve")
    def retrieve(payload: dict):
        query, top_k = payload.get("query") or "", int(payload.get("top_k") or 3)
        if not query:
            return {"chunks": []}
        with httpx.Client(timeout=10) as client:
            r = client.post(f"{QDRANT_URL}/collections/{COLLECTION}/points/search",
                            json={"vector": embed([query])[0], "limit": top_k, "with_payload": True})
            if r.status_code == 404:  # collection not created yet: nothing ingested
                return {"chunks": []}
            r.raise_for_status()
            return {"chunks": [
                {"text": p["payload"]["text"], "source": p["payload"].get("source", "?"), "score": round(float(p["score"]), 3)}
                for p in r.json().get("result", []) if p.get("payload", {}).get("text")
            ]}


    @app.post("/ingest")
    def ingest(payload: dict):
        bucket, prefix = payload.get("bucket", "rag-docs"), payload.get("prefix", "")
        client_s3, done = s3(), []
        with httpx.Client(timeout=60) as client:
            ensure_collection(client)
            for page in client_s3.get_paginator("list_objects_v2").paginate(Bucket=bucket, Prefix=prefix):
                for obj in page.get("Contents", []):
                    key = obj["Key"]
                    if not key.lower().endswith((".txt", ".md")):
                        continue
                    text = client_s3.get_object(Bucket=bucket, Key=key)["Body"].read().decode("utf-8", "replace")
                    parts = chunks_of(text)
                    if not parts:
                        continue
                    points = [
                        {"id": str(uuid.uuid5(uuid.NAMESPACE_URL, f"{bucket}/{key}#{i}")), "vector": v,
                         "payload": {"text": t, "source": key, "chunk": i}}
                        for i, (t, v) in enumerate(zip(parts, embed(parts)))
                    ]
                    client.put(f"{QDRANT_URL}/collections/{COLLECTION}/points?wait=true",
                               json={"points": points}).raise_for_status()
                    done.append({"source": key, "chunks": len(points)})
        return {"ingested": done}
  requirements.txt: |
    fastapi==0.115.6
    uvicorn==0.32.1
    httpx==0.27.2
    fastembed==0.4.2
    boto3==1.35.90

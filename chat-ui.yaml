# Light chat page to test the AI gateway end to end, at https://<node>/chat/
# Apply on the node:
#   sudo k3s kubectl apply -f https://raw.githubusercontent.com/equinix-svc/svc-helm-daihub/main/chat-ui.yaml
# Remove: sudo k3s kubectl delete -f <same url>
# The image (nginx + one static HTML page) is built from src/chat-ui/ by the "images" GitHub workflow.
# Day 0 installs it with the stack and sets the registry credentials (REGISTRY_USER, REGISTRY_TOKEN). The page calls LiteLLM on the same
# host (/v1/chat/completions) with the key you paste in it.
apiVersion: apps/v1
kind: Deployment
metadata: { name: chat-ui, namespace: ai-gateway }
spec:
  replicas: 1
  selector: { matchLabels: { app: chat-ui } }
  template:
    metadata: { labels: { app: chat-ui } }
    spec:
      imagePullSecrets: [{ name: ghcr-pull }]       # optional: only needed while the package is private
      containers:
        - name: nginx
          image: ghcr.io/equinix-svc/svc-helm-daihub/chat-ui:0.1.0
          imagePullPolicy: Always
          ports: [{ containerPort: 80 }]
          readinessProbe: { httpGet: { path: /chat/, port: 80 }, periodSeconds: 5 }
          resources: { requests: { cpu: 5m, memory: 8Mi }, limits: { memory: 64Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: chat-ui, namespace: ai-gateway }
spec: { selector: { app: chat-ui }, ports: [{ port: 80 }] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chat-ui
  namespace: ai-gateway
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  rules:
    - http:
        paths:
          - path: /chat
            pathType: Prefix
            backend: { service: { name: chat-ui, port: { number: 80 } } }
